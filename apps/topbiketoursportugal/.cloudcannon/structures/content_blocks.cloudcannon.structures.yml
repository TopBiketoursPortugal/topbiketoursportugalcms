# The page-builder picker for `content_blocks` arrays in page frontmatter.
# Composed at CloudCannon build time from each component's
# *.cloudcannon.structure-value.yml (astro-component-starter pattern).
content_blocks:
  id_key: _component
  style: modal
  values_from_glob:
    # All page-level blocks — site blocks and imported starter sections both
    # live under src/components/page-sections/ (starter taxonomy).
    - /src/components/page-sections/**/*.cloudcannon.structure-value.yml
    # Starter sections hidden from the picker because an existing site block
    # already covers them (hero, features/item-grid, featured-testimonials,
    # accordion, left-right/two-column-markdown). The components stay in the
    # repo and registered — delete a line here to re-enable one.
    - "!/src/components/page-sections/heroes/hero-center/hero-center.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/heroes/hero-split/hero-split.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/features/feature-grid/feature-grid.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/features/feature-slider/feature-slider.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/features/feature-split/feature-split.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/people/testimonial-section/testimonial-section.cloudcannon.structure-value.yml"
    - "!/src/components/page-sections/info-blocks/faq-section/faq-section.cloudcannon.structure-value.yml"
