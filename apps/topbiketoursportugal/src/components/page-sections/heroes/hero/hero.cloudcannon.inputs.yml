heading:
  options:
    preview:
      icon: short_text
      text:
        - key: heading_text
        - Heading
      subtext:
        - key: heading_gradient_color
        - Update heading gradient color and text content.
subheading:
  options:
    preview:
      icon: short_text
      text:
        - Subheading
      subtext:
        - Update subheading content and color.
heading_size:
  type: select
  options:
    values:
      - value: h1
        name: H1
      - value: h2
        name: H2
      - value: h3
        name: H3
      - value: h4
        name: H4
      - value: h5
        name: H5
      - value: h6
        name: H6
    value_key: value
    preview:
      text:
        - key: name
heading_gradient_color:
  type: select
  options:
    values: data.colors
    value_key: value
    preview:
      text:
        - key: name
image:
  options:
    preview:
      icon: image
      text:
        - key: alt_text
        - Image
      subtext:
        - key: image_path
        - Update image
      image:
        - key: image_path
