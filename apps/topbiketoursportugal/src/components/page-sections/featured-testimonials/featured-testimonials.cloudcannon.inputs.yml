carousel:
  type: switch
  comment: Enable carousel mode
cards_per_row:
  type: select
  options:
    values:
      - value: 1
        label: "1"
      - value: 2
        label: "2"
      - value: 3
        label: "3"
      - value: 4
        label: "4"
  comment: Number of cards to show (columns in grid or visible slides in carousel)
expand_behavior:
  type: select
  options:
    values:
      - hover
      - button
      - none
  comment: How to expand the testimonial content (Hover, Read More Button, or None)
feature_testimonials:
  type: multiselect
  options:
    empty_type: array
    values: collections.testimonials
    value_key: id
    preview:
      text:
        - key: title
      subtext:
        - key: language
      icon: chat
