text:
  type: markdown
  options:
    allow_resize: true
    allow_custom_markup: false
    remove_custom_markup: false
    initial_height: 320
    blockquote: true
    bold: true
    bulletedlist: true
    code: true
    copyformatting: true
    embed: true
    format: p h1 h2 h3 h4
    horizontalrule: true
    image: true
    image_size_attributes: true
    italic: true
    link: true
    numberedlist: true
    redo: true
    removeformat: true
    strike: true
    subscript: true
    superscript: true
    table: true
    underline: true
    undo: true
padding:
  options:
    values:
      - tight
      - normal
      - loose
    preview:
      icon: short_text
      text:
        - key: style.padding
container:
  options:
    values:
      - full
      - centered
    preview:
      icon: short_text
      text:
        - key: style.container
align:
  options:
    values:
      - leading
      - trailing
      - centered
    value_key: value
    preview:
      icon: short_text
      text:
        - key: style.layout
