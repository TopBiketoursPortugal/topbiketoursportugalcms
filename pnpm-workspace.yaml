allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - esbuild@0.24.3 || 0.28.1
  - svelte@5.51.5 || 5.53.5 || 5.55.7
  - '@astrojs/rss@4.0.19'
  - vite@8.2.0
# Security overrides for `pnpm audit` advisories.
# Ranged keys keep every package within its currently-installed major to avoid
# breaking framework majors. Astro is now a direct dependency pinned at v6.4.8
# (see package.json), so the former transitive astro advisory overrides were
# redundant and have been removed; svelte v4 untouched, vite v6/v7.
overrides:
  node-forge@<1.3.2: ^1.3.2
  undici@<6.27.0: ^6.27.0
  ws@<7.5.11: ^7.5.11
  postcss@<8.5.10: ^8.5.10
  follow-redirects@<1.15.12: ^1.15.12
  defu@<6.1.5: ^6.1.5
  fast-uri@<3.1.2: ^3.1.2
  flatted@<3.4.2: ^3.4.2
  h3@<1.15.9: ^1.15.9
  smol-toml@<1.6.1: ^1.6.1
  linkify-it@<5.0.1: ^5.0.1
  path-to-regexp@>=0.1.0 <0.1.13: ^0.1.13
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  qs@>=6.0.0 <6.14.2: ^6.14.2
  markdown-it@>=14.0.0 <14.1.2: ^14.1.2
  js-yaml@>=4.0.0 <4.1.2: ^4.1.2
  '@babel/core@>=7.0.0 <7.29.1': ^7.29.1
  '@xmldom/xmldom@>=0.8.0 <0.8.13': ^0.8.13
  devalue@>=5.0.0 <5.6.4: ^5.6.4
  immutable@>=4.0.0 <4.3.8: ^4.3.8
  immutable@>=5.0.0 <5.1.5: ^5.1.5
  axios@>=1.0.0 <1.16.0: ^1.16.0
  ajv@>=8.0.0 <8.18.0: ^8.18.0
  lodash@>=4.0.0 <4.17.24: ^4.17.24
  '@babel/plugin-transform-modules-systemjs@>=7.0.0 <7.29.4': ^7.29.4
  rollup@>=2.0.0 <2.80.0: ^2.80.0
  rollup@>=4.0.0 <4.59.0: ^4.59.0
  # Astro 7 requires Vite 8 (Rolldown). The former `vite: ^7.3.6` pin existed
  # because @tailwindcss/vite@4.3.0 broke under Vite 8 ("Missing field
  # tsconfigPaths"); @tailwindcss/vite@4.3.2 now peer-supports vite ^8, so the
  # pin is removed and the whole tree resolves onto Vite 8.
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  brace-expansion@<1.1.13: ^1.1.13
  brace-expansion@>=2.0.0 <2.0.3: ^2.0.3
  picomatch@>=2.0.0 <2.3.2: ^2.3.2
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  yaml@>=1.0.0 <1.10.3: ^1.10.3
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  svgo@>=2.0.0 <2.8.1: ^2.8.1
  svgo@>=3.0.0 <3.3.3: ^3.3.3
  serialize-javascript@>=6.0.0 <7.0.5: ^7.0.5
  tar@>=6.0.0 <7.5.16: ^7.5.16
  svelte@<=5.51.4: ^5.51.5
  svelte@<=5.53.4: ^5.53.5
  svelte@<=5.55.6: ^5.55.7
  # esbuild intentionally NOT overridden: its advisory (GHSA-67mh-4wv8-2f99) is a
  # dev-server-only CORS issue that doesn't affect production builds, and forcing
  # 0.28.x breaks Vite 6's bundled esbuild (destructuring downlevel for es2020).
