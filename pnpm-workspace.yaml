# Central version catalog: every dependency in package.json uses `catalog:`.
# `catalogMode: strict` makes `pnpm add <pkg>` write the version here.
catalogMode: strict
catalog:
  astro: 7.4.4
  astro-icon: 1.2.0
  astro-pagefind: 2.0.1
  astro-seo: 1.2.0
  '@astrojs/compiler-rs': 0.5.2
  '@astrojs/markdown-satteri': 0.4.6
  '@astrojs/mdx': 8.1.2
  '@astrojs/react': 7.1.2
  '@astrojs/rss': 4.0.19
  '@astrojs/sitemap': 3.7.4
  '@choctawnationofoklahoma/lite-vimeo': 1.3.1
  '@cloudcannon/editable-regions': 0.0.22
  clsx: 2.1.1
  embla-carousel: 8.6.0
  embla-carousel-auto-scroll: 8.6.0
  embla-carousel-autoplay: 8.6.0
  '@fontsource-variable/bricolage-grotesque': 5.3.0
  '@fontsource-variable/caveat': 5.3.0
  '@fontsource-variable/figtree': 5.3.0
  '@iconify-json/circle-flags': 1.2.14
  '@iconify-json/fa': 1.2.2
  '@iconify-json/logos': 1.2.18
  '@iconify-json/ph': 1.2.2
  '@iconify/tailwind': 1.2.0
  '@iconify/tailwind4': 1.2.3
  '@justinribeiro/lite-youtube': 1.9.0
  lefthook: 2.2.2
  markdown-it: 15.0.3
  markdown-it-external-links: 0.0.6
  mkcert: 3.2.0
  oxfmt: 0.75.0
  oxlint: 1.90.0
  react: 19.3.1
  react-dom: 19.3.1
  react-photo-album: 3.6.2
  remove-markdown: 0.8.0
  satteri: 0.11.6
  sharp: 0.35.5
  simple-git: 4.0.2
  slugify: 1.6.9
  svgo: 4.1.0
  tailwind-merge: 3.7.0
  tailwind-variants: 4.0.1
  tailwindcss: 4.3.3
  '@tailwindcss/typography': 0.5.20
  '@tailwindcss/vite': 4.3.3
  tw-animate-css: 1.4.0
  type-fest: 5.10.0
  '@types/markdown-it-external-links': 0.0.4
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  uuid: 14.0.3
  vanilla-cookieconsent: 3.2.1
  vite: 8.3.5
  vite-plugin-pwa: 1.3.0
  '@vite-pwa/assets-generator': 1.0.2
  '@vite-pwa/astro': 1.2.0
  workbox-window: 7.4.1
  yaml: 2.9.1
  yet-another-react-lightbox: 3.33.0
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  sharp: true
peerDependencyRules:
  allowedVersions:
    # 1.2.0 predates Astro 7 but builds and emits a correct service worker on
    # it; 2.x is a rewrite whose generated SW drops runtime cache expiration.
    '@vite-pwa/astro>astro': '7'
# Security overrides for `pnpm audit` advisories in transitive deps that are
# pinned outside the fixed range by their parent. Re-check with
# `pnpm audit` after upgrades and drop any line the parents have caught up on.
overrides:
  # @vite-pwa/assets-generator 1.x pins ^0.33 (libvips/libheif/librsvg CVEs).
  # Same API as 0.35; assets-generator 2.x already uses ^0.35.4.
  sharp@<0.35.5: 0.35.5
  # @tailwindcss/typography 0.5.20 pins 6.0.10 (quadratic selector parsing).
  postcss-selector-parser@<6.1.5: ^6.1.5
# Astro 7.4.4 + unifont 1.x: the npm font provider returns file:// URLs that
# Astro's font fetcher passes to fetch(). Drop once Astro reads them itself.
patchedDependencies:
  astro@7.4.4: patches/astro@7.4.4.patch
