[build.processing.html]
    pretty_urls = true

# Keep non-production deploys out of the index.
#
# Every deploy preview and branch deploy is a complete, publicly reachable copy
# of the live site. They shipped `<meta name="robots" content="index, follow">`,
# a permissive robots.txt and no X-Robots-Tag, so the only thing discouraging
# Google from indexing them was a canonical pointing at production — a hint,
# not a directive.
#
# `INDEX = "false"` is read by src/layouts/Layout.astro (noindex on every page)
# and src/pages/robots.txt.ts (`Disallow: /`). The header below is the belt to
# that braces: it applies to every response including assets, feeds and the
# sitemap, which carry no meta tag of their own.
#
# What this does NOT do is make previews private. Netlify serves them to
# anyone with the URL regardless of headers; closing that needs password
# protection on the Netlify site itself. Previews are left human-reachable on
# purpose so the team can review a branch.
[context.deploy-preview.environment]
    INDEX = "false"

[context.branch-deploy.environment]
    INDEX = "false"

[[context.deploy-preview.headers]]
    for = "/*"

    [context.deploy-preview.headers.values]
        X-Robots-Tag = "noindex, nofollow, noarchive"

[[context.branch-deploy.headers]]
    for = "/*"

    [context.branch-deploy.headers.values]
        X-Robots-Tag = "noindex, nofollow, noarchive"

# The two bare Netlify aliases serve the *production* deploy, so no
# per-context rule above can reach them: to Netlify they are the production
# context. They are byte-identical duplicates of the live site with no review
# value, and they took 246 real sessions from the public, so they are redirected
# at the edge rather than merely marked noindex.
#
# Deploy-preview and branch-deploy hostnames
# (`deploy-preview-12--boring-kepler-5712ff.netlify.app`,
# `some-branch--boring-kepler-5712ff.netlify.app`) do not match either pattern
# and stay reachable for review.
#
# These rules are reached because the generated dist/_redirects contains no
# host-qualified and no catch-all rules; Netlify evaluates _redirects first.
[[redirects]]
    from = "https://topbiketoursportugal.netlify.app/*"
    to = "https://topbiketoursportugal.com/:splat"
    status = 301
    force = true

[[redirects]]
    from = "https://boring-kepler-5712ff.netlify.app/*"
    to = "https://topbiketoursportugal.com/:splat"
    status = 301
    force = true

# Security headers.
#
# Before this, the only header the site sent was HSTS, which Netlify adds. The
# four below are enforcing because none of them can break a working page: they
# restrict framing, MIME sniffing, referrer leakage and unused browser features.
#
# HSTS is deliberately left as Netlify sets it (`max-age=31536000`, no
# `includeSubDomains`). Adding `includeSubDomains` commits *every* subdomain to
# valid HTTPS for a year and is not safely reversible, so it needs an audit of
# what subdomains exist before it goes on.
[[headers]]
    for = "/*"

    [headers.values]
        X-Frame-Options = "SAMEORIGIN"
        X-Content-Type-Options = "nosniff"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

        # Report-only on purpose. The site loads Google Tag Manager, Google
        # Analytics, Microsoft Clarity, WeTravel (the booking flow), Formspree
        # and two smaller trackers. A blocking policy shipped without watching
        # what it catches first would take the booking form down, so this
        # reports violations to the browser console and enforces nothing.
        #
        # To promote it: watch the console on a tour page and the checkout for a
        # release or two, fold in whatever legitimate origin it flags, then
        # rename the header to `Content-Security-Policy`.
        Content-Security-Policy-Report-Only = """
        default-src 'self'; \
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://*.google-analytics.com https://*.clarity.ms https://*.wetravel.com https://*.iconnode.com https://*.doubleclick.net https://s.ksrndkehqnwntyxlhgto.com; \
        style-src 'self' 'unsafe-inline'; \
        img-src 'self' data: blob: https:; \
        font-src 'self' data:; \
        connect-src 'self' https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.clarity.ms https://*.wetravel.com https://formspree.io https://*.doubleclick.net https://s.ksrndkehqnwntyxlhgto.com; \
        frame-src 'self' https://*.wetravel.com https://*.googletagmanager.com https://www.google.com https://www.youtube.com https://www.youtube-nocookie.com; \
        form-action 'self' https://formspree.io https://*.wetravel.com; \
        frame-ancestors 'self'; \
        base-uri 'self'; \
        object-src 'none'"""
