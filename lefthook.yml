pre-commit:
  commands:
    oxfmt:
      glob: '*.{js,mjs,ts,tsx,astro,json,md,css}'
      exclude: 'src/content/**'
      run: pnpm oxfmt {staged_files} && git add {staged_files}
    oxlint:
      glob: '*.{js,mjs,ts,tsx,astro}'
      run: pnpm oxlint --fix {staged_files} && git add {staged_files}
    # A new English entry gets a stub beside it in every other language, so a translation is
    # never simply forgotten. The stub is created `draft: false` and stays out of
    # the build until someone translates it — see src/schemas/published-glob.ts.
    # Runs before seo-url-history, which must see the stub to account for it.
    mdx-clone:
      glob: 'src/content/**/*.mdx'
      run: pnpm mdx-clone

    # A slug edit must ship with the 301 that preserves its old URL. Regenerate
    # and stage it rather than failing — the redirect is derivable, so there is
    # nothing for the committer to decide.
    seo-url-history:
      glob: 'src/content/**/*.{md,mdx}'
      run: pnpm seo:urls && git add data/url-history.json
