# yaml-language-server: $schema=https://raw.githubusercontent.com/CloudCannon/configuration-types/main/cloudcannon-config.schema.json
paths:
  uploads: src/assets/images
  static: ''
collections_config:
  pages:
    path: src/content/pages
    glob:
      - '**/*.md*'
    name: Pages
    icon: laptop_mac
    url: >-
      /[relative_base_path]/{path|default:title|deburr|slugify|lowercase|trim|strip|prepend:'/'|replace:'/home','/'|append:'/'|replace:'//','/'}
    disable_url: false
    description: ''
    _enabled_editors:
      - visual
      - data
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
    add_options:
      - name: Add New Page
        icon: pages
        schema: default
    create:
      path: '[relative_base_path]/{title|deburr|slugify|lower}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/page.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Page
        icon: web_asset
        _enabled_editors:
        create:
          path: '[relative_base_path]/{title|deburr|slugify|lower}.mdx'
          extra_data:
          publish_to:
          _inputs:
          _select_data:
          _structures:
        new_preview_url: >-
          /[relative_base_path]/{path|default:title|deburr|slugify|lowercase|trim|replace:'home',''}/
      paginated:
        path: schemas/paginated.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: Paginated collection
        icon: pages
        _enabled_editors:
        create:
        new_preview_url:
  blog:
    path: src/content/blog
    glob:
      - '**/*.md*'
    name: Blog
    icon: newspaper
    url: >-
      /[relative_base_path]/blog/{path|default:title|deburr|slugify|lowercase|trim}/
    disable_url: false
    description: ''
    _enabled_editors:
      - content
      - visual
    _inputs:
      relatedPosts:
        type: multiselect
        options:
          allow_create: false
          allow_empty: true
          values: collections.blog
          value_key: id
          preview:
            text:
              - key: title
            subtext:
              - key: language
            image:
              - key: image.src
          empty_type: array
        cascade: true
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          empty_type: string
          required: true
          required_message: Blog post title is required
        cascade: true
      image:
        type: image
        options:
          paths:
            uploads: src/assets/images
            static: ''
          empty_type: string
        cascade: true
      thumb_image_path:
        type: image
        options:
          paths:
            uploads: src/assets/images
            static: ''
          empty_type: string
          required: true
          required_message: A thumbnail image is required
        cascade: true
      image_alt:
        type: auto
        options:
          empty_type: string
        cascade: true
      author:
        type: auto
        options:
          empty_type: string
        cascade: true
      tags:
        type: multiselect
        options:
          allow_empty: true
          values: collections.postTags
          value_key: id
          preview:
            text:
              - key: name
            subtext:
              - key: language
            image:
              - key: seo.featured_image
          empty_type: array
        comment: To add a new tag, go to the postTags collection
        cascade: true
    add_options:
      - name: Add New Post
        icon: post_add
        schema: default
    create:
      path: '[relative_base_path]/{filename|deburr|slugify|lowercase}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/post.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: true
        name: New Post
        icon: notes
  data:
    path: data
    name: Data
    icon: drive_file_move
    disable_url: false
    description: ''
    _enabled_editors:
    _inputs:
      icons:
        type: auto
        comment: >-
          Add an icon from the list of [Font Awesome
          icons](https://fontawesome.com/search?o=r&m=free). Then add it to the
          ```~/components/utility/icon.astro.tsx``` file, following the existing
          pattern.
        cascade: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true
  tours:
    path: src/content/tours
    glob:
      - '**/*.md*'
    name: Tours
    singular_name: Tour
    icon: directions_bike
    url: >-
      /[relative_base_path]/tours/{path|default:title|deburr|slugify|lowercase|trim}/
    disable_url: false
    description: ''
    _enabled_editors:
    _inputs:
      title:
        type: text
        options:
          required: true
          required_message: Tour name is required
        cascade: true
      code:
        type: text
        options:
          required: true
          required_message: Tour code is required (e.g. CT 01)
        cascade: true
      difficulty:
        type: range
        options:
          min: 1
          max: 5
          step: 1
        comment: Tour difficulty (1 = easy, 5 = hard)
        cascade: true
      distance:
        type: number
        options:
          min: 1
          min_message: Distance must be at least 1 km
        comment: Tour distance in kilometers
        cascade: true
      duration:
        type: number
        options:
          min: 1
          min_message: Duration must be at least 1 day
        comment: Tour duration in days
        cascade: false
      type:
        type: select
        options:
          allow_create: false
          allow_empty: true
          values:
            - DayTour
            - PackageTour
            - WalkingTour
        cascade: true
      packages:
        type: array
        options:
          empty_type: array
          structures: _structures.tour_packages
        comment: Pricing table
        cascade: true
      packages[*].title:
        type: markdown
        cascade: true
      packages[*].description:
        type: markdown
        cascade: true
      packages[*].duration:
        type: text
        comment: Duration of this package (e.g. "3 days")
        cascade: true
      packagesTitle:
        type: text
        comment: Optional heading shown above the first pricing table
        cascade: true
      packages2:
        type: array
        options:
          empty_type: array
          structures: _structures.tour_packages
        comment: >-
          Seasons table — one column per package (same as the first table), with
          each season as a row (e.g. Low / Regular / High / Summer)
        cascade: true
      packages2Title:
        type: text
        comment: Heading for the seasons table (defaults to "Seasonal prices")
        cascade: true
      packages2[*].title:
        type: markdown
        cascade: true
      packages2[*].description:
        type: markdown
        cascade: true
      packages2[*].duration:
        type: text
        comment: Duration of this package (e.g. "3 days")
        cascade: true
      packages3:
        type: array
        options:
          empty_type: array
          structures: _structures.tour_packages
        comment: >-
          Add-ons table — one column per package (same as the first table), with
          each optional paid extra as a row (e.g. Bike rent, Half-board, Jersey)
        cascade: true
      packages3Title:
        type: text
        comment: Heading for the add-ons table (defaults to "Add-ons & extras")
        cascade: true
      packages3[*].title:
        type: markdown
        cascade: true
      packages3[*].description:
        type: markdown
        cascade: true
      packages3[*].duration:
        type: text
        comment: Duration of this package (e.g. "3 days")
        cascade: true
      packages[*].included:
        type: array
        options:
          empty_type: array
          structures: _structures.included_features
        cascade: true
      packages2[*].included:
        type: array
        options:
          empty_type: array
          structures: _structures.season_features
        comment: Season rows (e.g. "Low season" → price/supplement)
        cascade: true
      packages3[*].included:
        type: array
        options:
          empty_type: array
          structures: _structures.addon_features
        comment: Add-on rows (e.g. "Bike rent" → "+270€")
        cascade: true
      included:
        type: array
        options:
          empty_type: array
          structures: _structures.included_features
        comment: Features included in this package
        cascade: true
      included[*].title:
        type: markdown
        cascade: true
      included[*].description:
        type: markdown
        cascade: true
      included[*].info:
        type: text
        cascade: true
      itinerary:
        type: array
        options:
          empty_type: array
          structures: _structures.itinerary_stage
        cascade: true
      itinerary[*].title:
        type: markdown
        cascade: true
      itinerary[*].description:
        type: markdown
        cascade: true
      itinerary[*].location:
        type: object
        options:
          subtype: object
          empty_type: 'null'
          preview:
            text: city
            subtext: countryCode.englishName
            icon: map
          place_groups_below: false
        cascade: true
      itinerary[*].location.lat:
        type: text
        cascade: true
      itinerary[*].location.lon:
        type: text
        cascade: true
      itinerary[*].location.country:
        type: select
        options:
          allow_empty: true
          values: data.countries
          value_key: alpha2
          preview:
            text: englishName
          picker_preview:
            text: englishName
            subtext: alpha2
        cascade: true
      itinerary[*].location.city:
        type: text
        cascade: true
      itinerary[*].location.region:
        type: text
        cascade: true
      relatedTours:
        type: multiselect
        options:
          allow_empty: true
          values: collections.tours
          value_key: id
          preview:
            text:
              - key: title
            subtext:
              - key: language
            image:
              - key: image.src
          empty_type: array
        cascade: true
      faqs:
        type: array
        options:
          empty_type: array
          structures: _structures.faqs
        cascade: true
      faqs[*].question:
        type: markdown
        cascade: true
      faqs[*].answer:
        type: markdown
        cascade: true
      images:
        type: array
        options:
          empty_type: array
          structures: _structures.images
        cascade: true
      tags:
        type: multiselect
        options:
          allow_empty: true
          values: collections.tourTags
          value_key: id
          preview:
            text:
              - key: title
            subtext:
              - key: language
            image:
              - key: seo.featured_image
          empty_type: array
        cascade: true
      riderLevels:
        type: multiselect
        options:
          allow_empty: true
          values: collections.tourRiderLevels
          value_key: id
          preview:
            text:
              - key: name
            subtext:
              - key: language
            image:
              - key: seo.featured_image
          empty_type: array
        comment: Select rider levels for this tour (Beginner, Intermediate, Advanced)
        cascade: true
      bikeCategories:
        type: multiselect
        options:
          allow_empty: true
          values: collections.bikeCategories
          value_key: id
          preview:
            text:
              - key: title
            subtext:
              - key: language
          empty_type: array
        comment: Select bicycle types available for this tour
        cascade: true
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      region:
        type: select
        options:
          allow_create: false
          allow_empty: true
          values: collections.tourRegions
          value_key: id
          preview:
            text:
              - key: name
            subtext:
              - key: language
            image:
              - key: seo.featured_image
        comment: To add a new region, go to the tour regions collection
        cascade: true
      content:
        type: markdown
        cascade: true
      afterPricing:
        type: markdown
        cascade: true
      closestAirport:
        type: text
        cascade: true
      isNewTour:
        type: checkbox
        comment: >-
          Mark this tour as new to display a green "NEW" badge over the tour
          image
        cascade: true
    add_options:
      - name: New Tour English
        icon: language
        editor: visual
        base_path: ''
        schema: default
      - name: New Tour Portuguese
        icon: language
        editor: visual
        base_path: /pt/
        schema: defaultPT
    create:
      path: '[relative_base_path]/{title|deburr|slugify|lowercase}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/tour.mdx
        reorder_inputs: true
        hide_extra_inputs: true
        remove_empty_inputs: true
        remove_extra_inputs: false
        name: New tour
        icon: notes
      defaultPT:
        path: schemas/pt/tour.mdx
        reorder_inputs: true
        hide_extra_inputs: true
        remove_empty_inputs: true
        remove_extra_inputs: true
        name: New tour
        icon: notes
  testimonials:
    path: src/content/testimonials
    glob:
      - '**/*.md*'
    name: Testimonials
    singular_name: Testimonial
    icon: notes
    disable_url: true
    preview:
      text:
        - key: title
      subtext:
        - template: '{language} - {author.country} - {author.name}'
    _enabled_editors:
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          required: true
          required_message: Testimonial title is required
        cascade: true
      quote:
        type: markdown
        options:
          required: true
          required_message: Review quote text is required
        cascade: true
      reviewSource:
        type: url
        options:
          hide_link_to_file: true
          hide_link_to_page: true
          hide_link_to_email_address: true
        cascade: true
      score:
        type: number
        options:
          min: 1
          max: 5
        cascade: true
      author.avatar:
        type: image
        cascade: true
      relatedProduct:
        type: select
        options:
          allow_empty: true
          values: collections.tours
          value_key: id
          preview:
            text:
              - key: title
            subtext:
              - key: language
            image:
              - key: image.src
        cascade: true
      language:
        type: select
        options:
          allow_create: false
          allow_empty: false
          values:
            - name: Portuguese
              value: pt
            - name: English
              value: en
        cascade: true
    add_options:
      - name: New Testimonial
        icon: language
        editor: content
        base_path: ''
        schema: default
    create:
      path: '[relative_base_path]/{title|deburr|slugify|lowercase|trim}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/testimonial.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Testimonial
        icon: message
  team:
    path: src/content/team
    glob:
      - '**/*.md*'
    name: Team
    singular_name: Team member
    icon: people
    url: >-
      /[relative_base_path]/team/{path|default:title|deburr|slugify|lowercase|trim}/
    disable_url: false
    description: ''
    preview:
      text:
        - key: title
      subtext:
        - key: subTitle
      image:
        - key: image.src
    _enabled_editors:
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          required: true
          required_message: Team member name is required
        cascade: true
      language:
        type: select
        options:
          allow_create: false
          allow_empty: false
          values:
            - name: Portuguese
              value: pt
            - name: English
              value: en
        hidden: true
        cascade: true
      subTitle:
        type: select
        options:
          allow_create: true
          allow_empty: false
          values:
            - name: Guide
              key: Guide
            - name: Owner / Founder
              key: Owner
          value_key: code
        cascade: true
    disable_add: false
    disable_add_folder: false
    disable_file_actions: false
  tourRegions:
    path: src/content/tour-regions
    glob:
      - '**/*.md*'
    name: Tour Regions
    singular_name: Tour Region
    icon: place
    url: >-
      /[relative_base_path]/tours/regions/{path|default:name|default:title|deburr|slugify|lowercase|trim}/
    disable_url: false
    description: ''
    preview:
      text:
        - key: title
      image:
        - key: seo.featured_image
    _enabled_editors:
      - visual
      - data
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          required: true
          required_message: Region name is required
        cascade: true
      name:
        type: text
        options:
          required: true
          required_message: Region display name is required
        cascade: true
      language:
        type: select
        options:
          allow_create: false
          allow_empty: false
          values:
            - name: Portuguese
              value: pt
            - name: English
              value: en
        hidden: true
        cascade: true
    add_options:
      - name: New Tour Region English
        icon: language
        editor: visual
        base_path: ''
        schema: default
      - name: New Tour Region Portuguese
        icon: language
        editor: visual
        base_path: /pt/
        schema: defaultPT
    create:
      path: '[relative_base_path]/{title|deburr|slugify|lowercase}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/tour-region.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Tour Region
        icon: pedal_bike
      defaultPT:
        path: schemas/pt/tour-region.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Tour Region
        icon: pedal_bike
  tourTags:
    path: src/content/tour-tags
    glob:
      - '**/*.md*'
    name: Tour Tags
    singular_name: Tour Tag
    icon: tag
    url: >-
      /[relative_base_path]/tours/tags/{path|default:title|deburr|slugify|lowercase|trim}/
    disable_url: false
    description: ''
    preview:
      text:
        - key: title
      image:
        - key: seo.featured_image
    _enabled_editors:
      - visual
      - data
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          required: true
          required_message: Tag title is required
        cascade: true
      name:
        type: text
        options:
          required: true
          required_message: Tag display name is required
        cascade: true
      language:
        type: select
        options:
          allow_create: false
          allow_empty: false
          values:
            - name: Portuguese
              value: pt
            - name: English
              value: en
        hidden: true
        cascade: true
      icon:
        type: select
        options:
          allow_create: false
          allow_empty: true
          values:
            - name: Wine
              value: ph--wine-light
            - name: Gastronomy (Fork & Knife)
              value: ph--fork-knife-light
            - name: Cultural & Heritage (Bank)
              value: ph--bank-light
            - name: Coastal (Waves)
              value: ph--waves-light
            - name: Pilgrimage (Church)
              value: ph--church-light
            - name: Nature (Tree)
              value: ph--tree-light
            - name: City Tours (Buildings)
              value: ph--buildings-light
            - name: Mountain (Mountains)
              value: ph--mountains-light
            - name: Families (Users)
              value: ph--users-light
        cascade: true
    add_options:
      - name: New Tour Tag English
        icon: language
        editor: visual
        base_path: ''
        schema: default
      - name: New Tour Tag Portuguese
        icon: language
        editor: visual
        base_path: /pt/
        schema: defaultPT
    create:
      path: '[relative_base_path]/{title|deburr|slugify|lowercase}.mdx'
    disable_add: false
    disable_add_folder: true
    disable_file_actions: true
    schemas:
      default:
        path: schemas/tour-tag.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Tour Tag
        icon: pedal_bike
      defaultPT:
        path: schemas/pt/tour-tag.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Tour Tag
        icon: pedal_bike
