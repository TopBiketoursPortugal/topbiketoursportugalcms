      riderLevelPT:
        path: schemas/pt/tour-rider-level.mdx
        reorder_inputs: true
        hide_extra_inputs: false
        remove_empty_inputs: false
        remove_extra_inputs: false
        name: New Rider Level
        icon: fitness_center
  bikeCategories:
    path: src/content/bike-categories
    glob:
      - '**/*.md*'
    name: Bike Categories
    singular_name: Bike Category
    icon: pedal_bike
    disable_url: false
    preview:
      text:
        - key: title
    _enabled_editors:
      - data
      - content
    _inputs:
      id:
        type: auto
        instance_value: UUID
        hidden: true
        cascade: true
      title:
        type: text
        options:
          required: true
          required_message: Bike category name is required
        cascade: true
