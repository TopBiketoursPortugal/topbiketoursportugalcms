# Metadata about this component, to be used in the CMS
spec:
  structures:
    - content_blocks
  label: Featured testimonials/reviews
  description: Featured testimonials grid
  icon: 'message'
  tags:
    - Grid
    - Testimonials
    - Tours

# Defines the structure of this component, as well as the default values
blueprint:
  feature_testimonials: []
  carousel: false
  cards_per_row: 3
  expand_behavior: hover

# Overrides any fields in the blueprint when viewing this component in the component browser
preview:
  text:
    - key: title
  subtext:
    - key: language
# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  carousel:
    type: boolean
    comment: Enable carousel mode
  cards_per_row:
    type: select
    options:
      values: [1, 2, 3, 4]
    comment: Number of cards to show (columns in grid or visible slides in carousel)
  expand_behavior:
    type: select
    options:
      values: [hover, button, none]
    comment: How to expand the testimonial content (Hover, Read More Button, or None)
  feature_testimonials:
    type: multiselect
    options:
      empty_type: array
      values: collections.testimonials
      value_key: id
      preview:
        text:
          - key: title
        subtext:
          - key: language
        icon: message
