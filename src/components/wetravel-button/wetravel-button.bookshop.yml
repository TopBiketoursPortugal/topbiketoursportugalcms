# wetravel-button.bookshop.yml
spec:
  structures:
    - content_blocks
  label: WeTravel Book Now
  description: A WeTravel checkout button (opens the booking/calendar overlay)
  icon: event_available
  tags:
    - booking
    - tours
    - wetravel

blueprint:
  uuid: ''
  label: 'Book Now'
  heading: ''
  uid: '2317568'

_inputs:
  uuid:
    type: text
    label: WeTravel Trip UUID
    comment: >-
      The data-uuid from the WeTravel embed snippet (the value after
      ?uuid= in the checkout URL).
    required: true
  label:
    type: text
    label: Button Label
    default: 'Book Now'
  heading:
    type: text
    label: Heading (optional)
    comment: Optional title shown above the button, e.g. the tour name.
  uid:
    type: text
    label: WeTravel Account ID (uid)
    default: '2317568'
    hidden: true

preview:
  text:
    - key: heading
    - 'WeTravel Book Now'
  subtext:
    - key: uuid
    - 'Configure the WeTravel trip UUID'
  icon: event_available
